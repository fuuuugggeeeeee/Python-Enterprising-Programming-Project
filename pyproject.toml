[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-programming-project"
version = "1.0.0"
description = "Runnable Python examples of concurrency, design patterns, persistence, and HTTP services"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Xichavelo Refuge Rikhotso" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/DevWithX/Python-Enterprising-Programming-Project"

[project.scripts]
enterprise-project = "enterprise_programming.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
