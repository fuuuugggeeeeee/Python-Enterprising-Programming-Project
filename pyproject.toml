[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-programming-project"
version = "2.0.0"
description = "Tested Python backend with concurrency, design patterns, FastAPI, PostgreSQL, and observability"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Xichavelo Refuge Rikhotso" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "alembic>=1.18,<2",
  "fastapi>=0.141,<1",
  "prometheus-client>=0.24,<1",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.12,<3",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.13,<3",
  "SQLAlchemy>=2.0.52,<2.1",
  "uvicorn[standard]>=0.40,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.12,<3",
  "mypy>=1.19,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.1,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.16,<1",
  "uv>=0.12,<1",
]

[project.urls]
Repository = "https://github.com/DevWithX/Python-Enterprising-Programming-Project"

[project.scripts]
enterprise-project = "enterprise_programming.cli:main"
enterprise-api = "enterprise_programming.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a running PostgreSQL database",
]

[tool.coverage.run]
branch = true
source = ["enterprise_programming"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/enterprise_programming/api/dependencies.py" = ["B008"]
"src/enterprise_programming/api/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
